<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="크아">
  <title>크레이지 아케이드</title>
  <meta name="description" content="크레이지 아케이드 PC판을 휴대폰에서. 1:1, 2:2 팀전과 개인전 온라인 대전.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0b3f8f">
</head>

<body>
  <canvas id="game"></canvas>

  <!-- Intro: tap to start (this also lets the browser play sound), as in the other taebo games. -->
  <div id="intro">
    <div class="intro-logo">
      <canvas id="intro-chars" width="420" height="150"></canvas>
      <h1>크레이지<br>아케이드</h1>
      <p>태보 에디션</p>
    </div>
    <p id="intro-tap">불러오는 중…</p>
  </div>

  <!-- First visit: a nickname is all the sign-up there is; it is remembered on this phone. -->
  <div id="signup" hidden>
    <form id="signup-form" class="card">
      <h2>닉네임을 정해 주세요</h2>
      <p>처음 한 번만 정하면 다음부터는 바로 들어가요.</p>
      <input id="signup-name" type="text" maxlength="10" placeholder="닉네임 (10자까지)" autocomplete="nickname">
      <button type="submit" class="big-btn">시작하기</button>
    </form>
  </div>

  <!-- Home: my character, records and lucci, then on to the game. -->
  <div id="home" hidden>
    <header class="logo small"><h1>크레이지 아케이드</h1></header>
    <section id="home-card">
      <button type="button" class="home-figure" id="home-figure" aria-label="캐릭터 바꾸기"><canvas id="home-char" width="180" height="180"></canvas></button>
      <div class="home-info">
        <span id="home-charname"></span>
        <label class="home-name"><span>내 이름</span><input id="home-name" type="text" maxlength="10" autocomplete="nickname"></label>
        <dl id="home-stats">
          <div><dt>루찌</dt><dd id="home-lucci">-</dd></div>
          <div><dt>전적</dt><dd id="home-record">-</dd></div>
          <div><dt>승률</dt><dd id="home-rate">-</dd></div>
          <div><dt>물풍선으로 가둔 수</dt><dd id="home-kills">-</dd></div>
        </dl>
        <div class="home-actions">
          <button type="button" id="home-chars" class="chip">캐릭터 바꾸기</button>
          <button type="button" id="home-shop" class="chip shop">상점·꾸미기</button>
          <button type="button" id="home-music" class="chip">♪</button>
        </div>
      </div>
    </section>
    <button type="button" id="home-play" class="big-btn">게임하러 가기</button>
  </div>

  <!-- Menu: practice against the computer, or an online room with friends (as in worms). -->
  <div id="menu" hidden>
    <header class="logo small"><h1>크레이지 아케이드</h1></header>
    <div class="cards">
      <section class="card" id="practice-card">
        <h2><b>1</b>컴퓨터와 연습</h2>
        <label class="opt"><span>대결</span><select id="practice-size"></select></label>
        <label class="opt"><span>맵</span><select id="practice-map"></select></label>
        <button type="button" id="practice-start" class="big-btn">연습 시작</button>
      </section>
      <section class="card" id="online-card">
        <h2><b>2</b>친구와 온라인 대전</h2>
        <p class="sub">최대 8명 · 팀전(1:1 ~ 4:4) 또는 개인전 · 맵은 방장이 골라요</p>
        <button type="button" id="host" class="big-btn blue">방 만들기</button>
        <div class="or"><span>또는 친구 방에 들어가기</span></div>
        <div class="join-row">
          <input id="join-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="방 번호 4자리" autocomplete="off">
          <button type="button" id="join" class="big-btn green">참가</button>
        </div>
        <p id="net-status"></p>
      </section>
    </div>
    <footer class="menu-bar">
      <button type="button" id="menu-home" class="chip">← 처음으로</button>
      <button type="button" id="menu-shop" class="chip shop">상점·꾸미기</button>
    </footer>
  </div>

  <!-- Waiting room: room number and invite link, team or solo, who sits where, map, start. -->
  <div id="lobby" hidden>
    <div class="lobby-card">
      <div class="lobby-head">
        <div id="lobby-code-box"><span>방 번호</span><strong id="lobby-code">----</strong><button type="button" id="share-link" class="chip">초대 링크 보내기</button></div>
        <div id="lobby-mode">
          <button type="button" data-mode="team">팀전 <small>1:1 ~ 4:4</small></button>
          <button type="button" data-mode="solo">개인전 <small>2~8명</small></button>
        </div>
      </div>
      <div id="seats"></div>
      <div class="lobby-foot">
        <canvas id="lobby-mm" width="74" height="64"></canvas>
        <label class="opt lobby-map"><span>맵</span><select id="lobby-map"></select></label>
        <button type="button" id="lobby-char" class="chip">캐릭터 바꾸기</button>
        <button type="button" id="lobby-shop" class="chip shop">상점</button>
      </div>
      <p id="lobby-status"></p>
      <div class="lobby-actions">
        <button type="button" id="lobby-start" class="big-btn" hidden>게임 시작</button>
        <button type="button" id="lobby-leave" class="chip">나가기</button>
      </div>
    </div>
  </div>

  <!-- Shop: characters, hats, balloon skins and pets for lucci, with the character wearing them. -->
  <div id="shop" hidden>
    <div class="shop-card">
      <div class="shop-head">
        <h2>상점</h2>
        <span class="shop-lucci"><b id="shop-lucci">0</b> 루찌</span>
        <button type="button" id="shop-close" class="chip">← 나가기</button>
      </div>
      <div id="shop-tabs">
        <button type="button" data-kind="char">캐릭터</button>
        <button type="button" data-kind="hat">머리장식</button>
        <button type="button" data-kind="bomb">물풍선</button>
        <button type="button" data-kind="pet">펫</button>
      </div>
      <div class="shop-body">
        <div class="shop-list">
          <div id="shop-grid"></div>
          <div class="shop-pager"><button type="button" id="shop-prev" class="chip">◀ 이전</button><span id="shop-page"></span><button type="button" id="shop-next" class="chip">다음 ▶</button></div>
        </div>
        <aside class="shop-side">
          <canvas id="shop-preview" width="200" height="190"></canvas>
          <b id="shop-name">물건을 고르세요</b>
          <span id="shop-price"></span>
          <button type="button" id="shop-act" class="big-btn" hidden></button>
        </aside>
      </div>
    </div>
  </div>

  <!-- Character choice (from the home screen or the waiting room). -->
  <div id="char-pick" hidden>
    <div class="card">
      <h2>캐릭터 고르기</h2>
      <div id="char-grid"></div>
      <button type="button" id="char-close" class="chip">닫기</button>
    </div>
  </div>

  <div id="toast" hidden></div>
  <div id="rotate">가로로 돌려 주세요 ↻</div>
  <div id="gate" hidden>
    <form id="gate-form"><p>비밀번호</p><input id="gate-pass" type="password" autofocus><button>확인</button></form>
  </div>
  <script src="js/app.js"></script>
</body>

</html>
